# Run db/sqlserver/schema.sql once, then start with --spring.profiles.active=sqlserver
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=payments;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
payment:
  seed-reference-data: false
