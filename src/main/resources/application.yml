spring:
  application:
    name: payment-service
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlserver://CITC-CCU-TC-D05;databaseName=C3;encrypt=true;trustServerCertificate=true
    username: C3SvcAccount
    password: Welcome@1234
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      max-poll-records: 1
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

payment:
  processor:
    priority: NEW,RETRY_1,RETRY_2,RETRY_3
  default-currency: INR
  seed-reference-data: false
  topics:
    request: payment.request
  retry:
    delays: PT15M,PT1H,PT4H
    max-retries: 3
    scheduler:
      retry1-interval-ms: 900000
      retry2-interval-ms: 3600000
      retry3-interval-ms: 14400000
  pending:
    # Wait 15 minutes after a PENDING/ambiguous bank result before the next TransactionInquiry.
    inquiry-delay: PT15M
    max-inquiries: 96
    poll-interval-ms: 900000
  otp:
    expiry: PT2M
    expiry-check-interval-ms: 120000
  txn-categories:
    "1024": SALARY_PAYMENT
    "1025": VENDOR_PAYMENT
    "1026": REIMBURSEMENT
    "1027": ADVANCE
    "1028": LOAN

icici:
  client: dummy
  credentials:
    aggr-id: LOCAL-DUMMY-AGGR
    aggr-name: LOCAL-DUMMY
    corp-id: LOCAL-DUMMY-CORP
    user-id: LOCAL-DUMMY-USER
    urn: LOCAL-DUMMY-URN
  http:
    otp-path: /api/Corporate/CIB/v1/TransactionOTP
    txn-path: /api/Corporate/CIB/v1/Create
    inquiry-path: /api/Corporate/CIB/v1/TransactionInquiry
    account-statement-path: /api/Corporate/CIB/v1/AccountStatement
    balance-inquiry-path: /api/Corporate/CIB/v1/BalanceInquiry
    timeout: PT30S
  dummy:
    default-scenario: SUCCESS
    scenario-by-ben-acct-id:
      "901": HOST_DOWN_ONCE
      "902": HOST_DOWN
      "903": INSUFFICIENT
      "904": TIMEOUT
      "905": TIMEOUT_NOT_PROCESSED
      "906": PENDING
      "907": BENE_TIMEOUT
      "908": CLOSED_ACCOUNT
      "909": INVALID_IFSC

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: Payment Service
    description: Payment orchestration and ICICI integration
    version: 0.2.0

worklist:
  service:
    base-url: ${WORKLIST_SERVICE_URL:http://localhost:9090}
    task-create-path: /api/v1/worklist/tasks
    task-by-code-path: /api/v1/worklist/tasks/{taskCode}
    task-status-path: /api/v1/worklist/tasks/{taskId}/status
    task-code: PAYMENT_OTP_AUTHORIZATION
    task-name: Authorize Payment Transaction
    ref-entity-name: BENEFICIARY
    linked-instance-entity-name: ONBOARDING
    linked-instance-entity-id: 1001
    assignee-role-code: ACCOUNTS
